name: Harness checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    container:
      image: racket/racket:8.10-bc@sha256:8c527e0cca4650a6bdd73f3f73fe203ede6317c82f3f3f33bc861cec981e8b2d
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Git for source-lock tests
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - name: Install Racket test libraries
        run: raco pkg install --auto --no-docs compiler-lib rackunit-lib compatibility-lib
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Link local Racket collection
        run: raco pkg install --auto --link
      - name: Racket smoke tests
        run: bash scripts/test_racket.sh
      - name: Python offline harness tests
        # The shared Makefile target, so the CI list cannot drift from `make test`.
        run: make test-python PYTHON=python
