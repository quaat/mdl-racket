name: Harness checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Racket
        run: |
          sudo apt-get update
          sudo apt-get install -y racket
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Link local Racket collection
        run: raco pkg install --auto --link
      - name: Racket smoke tests
        run: make test-racket
      - name: Python offline harness tests
        run: make test-python
