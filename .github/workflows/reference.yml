name: Native Confusion reference
on:
  pull_request:
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y racket g++ make perl libgc-dev
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify pinned sources and reader
        run: |
          make sources
          make check-source
      - name: Build and capture native reference
        run: |
          make reference-build
          make reference-capture
          make reference-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reference-evidence
          path: |
            artifacts/environment/sources.json
            artifacts/reference/house.json
            artifacts/reference/primitives.json
            docs/evidence/M0/reader-sweep.json
