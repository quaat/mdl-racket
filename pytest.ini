[pytest]
# Native tests need the real mdli binary and gcc. They are excluded from every
# normal pytest invocation (make test / make test-python / CI) and run only via
# `make test-boot-reference`, which passes `-m native` (overrides this -m).
addopts = -m "not native"
markers =
    native: requires the native mdli binary and gcc; opt-in via make test-boot-reference
